{
  "$schema": "node_modules/wrangler/config-schema.json",
  "name": "morris-multiplayer",
  "main": "index.js",
  "compatibility_date": "2024-04-05",
  "durable_objects": {
    "bindings": [
      {
        "name": "MY_DURABLE_OBJECT",
        "class_name": "MyDurableObject"
      }
    ]
  },
  "exports": {
    "MyDurableObject": {
      "type": "durable-object",
      "storage": "sqlite"
    }
  }
}