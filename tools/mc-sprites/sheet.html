<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#000">
<script src="/js/three.min.js"></script>
<script type="module">
import { makeHero } from '/@fs/workspace/mg-push/src/pages/MorrisCurse/_core/engine/heroes.js';
const THREE = window.THREE;
const ids = ['spearman', 'rogue', 'mage', 'warrior'];
const FW = 128, FH = 160; // рендер 4× от 32×40
const R = new THREE.WebGLRenderer({ antialias: false, alpha: true, preserveDrawingBuffer: true });
R.setSize(FW, FH); R.outputEncoding = THREE.sRGBEncoding; R.setClearColor(0x000000, 0);
const out = {};
const rows = [['down', 0], ['left', -Math.PI / 2], ['right', Math.PI / 2], ['up', Math.PI]];
const sws = [0.55, 0, -0.55];
for (const id of ids) {
  const sheet = document.createElement('canvas'); sheet.width = FW * 3; sheet.height = FH * 4;
  const c2 = sheet.getContext('2d');
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x554466, 0.55));
  scene.add(new THREE.AmbientLight(0xffffff, 0.35));
  const sun = new THREE.DirectionalLight(0xffffff, 0.75); sun.position.set(-3, 6, 5); scene.add(sun);
  const hero = makeHero(THREE, id);
  scene.add(hero.group);
  hero.pose(0, 0);
  const box = new THREE.Box3().setFromObject(hero.group);
  const hgt = 2.5, cy = 1.3; // общий масштаб — сохраняем разницу в росте героев
  const half = hgt * 0.56; // кадр 32×40: высота с запасом, ширина = 0.8 высоты
  const cam = new THREE.OrthographicCamera(-half * 0.8, half * 0.8, half, -half, 0.1, 80);
  const el = 0.32; // ~18° сверху — как у пиксельных RPG-листов
  cam.position.set(0, cy + Math.sin(el) * 20, Math.cos(el) * 20); cam.lookAt(0, cy, 0);
  out[id + '_box'] = [box.min.y, box.max.y, box.min.x, box.max.x];
  rows.forEach(([name, yaw], r) => sws.forEach((sw, c) => {
    hero.pose(sw, yaw); hero.chibi(1.45);
    R.render(scene, cam);
    c2.drawImage(R.domElement, c * FW, r * FH);
  }));
  out[id] = sheet.toDataURL('image/png');
}
window.__SHEETS = out;
</script></body></html>
