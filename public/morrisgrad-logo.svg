<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Моррис Град">
  <defs>
    <radialGradient id="sky" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#3a215c"/>
      <stop offset="55%" stop-color="#160c24"/>
      <stop offset="100%" stop-color="#07040d"/>
    </radialGradient>
    <radialGradient id="moon" cx="38%" cy="36%" r="68%">
      <stop offset="0%" stop-color="#f3e9ff"/>
      <stop offset="42%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2433"/>
      <stop offset="100%" stop-color="#0c0a10"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#c084fc" flood-opacity="0.45"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#sky)"/>
  <circle cx="256" cy="256" r="246" fill="none" stroke="#c084fc" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#e8e0f0" stroke-opacity="0.18" stroke-width="1"/>

  <g filter="url(#soft)">
    <circle cx="318" cy="168" r="78" fill="url(#moon)"/>
    <circle cx="338" cy="150" r="10" fill="#5b21b6" fill-opacity="0.28"/>
    <circle cx="292" cy="188" r="16" fill="#4c1d95" fill-opacity="0.22"/>
    <circle cx="346" cy="196" r="7" fill="#6d28d9" fill-opacity="0.25"/>
  </g>

  <!-- ground -->
  <path d="M78 392c46-28 92-18 132-34 28-11 48-8 78 6 34 16 62 8 98-10 28-14 52-10 78 8v62H78z" fill="#100c16"/>

  <!-- castle, black-infected stone -->
  <g fill="url(#stone)" stroke="#1a1424" stroke-width="2" stroke-linejoin="round">
    <path d="M118 360V214h28v-28h18v28h22v-46h18v46h22v-28h18v28h28v146z"/>
    <path d="M118 214l14-22 14 22zm68-46l9-16 9 16zm68 46l14-22 14 22z"/>
    <rect x="206" y="292" width="42" height="68"/>
    <path d="M206 292c0-22 42-22 42 0"/>
    <rect x="154" y="248" width="18" height="28"/>
    <rect x="282" y="248" width="18" height="28"/>
    <rect x="248" y="236" width="14" height="22"/>
  </g>

  <!-- black infection veins -->
  <g fill="none" stroke="#050308" stroke-width="3.2" stroke-linecap="round">
    <path d="M168 214c8 22 4 48-10 70"/>
    <path d="M186 250c18 8 22 28 14 52"/>
    <path d="M227 292c-6 18 4 34 18 48"/>
    <path d="M286 236c10 16 8 36-2 58"/>
    <path d="M312 268c14 10 18 28 10 52"/>
  </g>
  <g fill="#07040c">
    <circle cx="164" cy="248" r="5"/>
    <circle cx="198" cy="286" r="4"/>
    <circle cx="236" cy="318" r="5"/>
    <circle cx="292" cy="274" r="4.5"/>
    <circle cx="318" cy="312" r="5"/>
    <path d="M214 360c6-16 18-16 26 0 6 14-4 22-13 22s-19-8-13-22z"/>
  </g>

  <!-- gate glow, almost swallowed -->
  <path d="M220 326h16c0 12 6 22 6 34h-28c0-12 6-22 6-34z" fill="#2a103c"/>
  <path d="M226 334h6v26h-6z" fill="#c084fc" fill-opacity="0.35"/>

  <text x="256" y="452" text-anchor="middle" fill="#e8e0f0" font-family="Georgia, 'Times New Roman', serif" font-size="28" letter-spacing="6">МОРРИС ГРАД</text>
</svg>
